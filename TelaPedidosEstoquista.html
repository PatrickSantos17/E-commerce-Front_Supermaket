<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelaPedidosEstoquista</title>
  <link rel="stylesheet" href="CSS/Reset/Reset.css">
  <link rel="stylesheet" href="CSS/PedidosEstoquista/PedidosEstoquista.css">
  <link rel="stylesheet" href="CSS/HeaderFuncionario/HeaderFuncionario.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body>
  <header>
    <div class="lado-a">
      <a href="/TelaInicial.html"><img src="src/img/logo-removebg-preview.png" alt="logo-img"></a>
      <input type="search" id="buscar" name="q" placeholder="Buscar">
    </div>
    <div class="lado-b">
      <div class="info-usuario">
        <img id="iconUsuario" src="" alt="user-icon">
        <p class="nome-usuario"></p>
      </div>
      <div class="info-usuario">
        <p class="grupo-usuario"></p>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="header">
      <span>Listagem de Pedidos</span>
    </div>
    <div class="divTable">
      <table>
        <thead>
          <tr>
            <th>N° pedido</th>
            <th>Data</th>
            <th>Status</th>
            <th>Total</th>
            <th class="acao">Alterar</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  <div id="cartao-alterarStatus" class="cartao">
    <div class="modal-dados-endereco">
      <div class="fechar-x">
        <span class="close">&times;</span>
      </div>
      <form class="modal-completo-alterarStatus">
        <h2>NOVO STATUS</h2>
        <div class="col-md-8 order-md-1">
          <form class="form" novalidate>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nPedido">N° pedido</label>
                <input type="text" class="form-control cep" id="nPedido" inputmode="numeric" disabled>
              </div>
              <div class="col-md-6 mb-3">
                <label for="status">Status</label>
                <select name="status_options" class="form-control" id="status">
                  <option value="Aguardando pagamento" selected>Aguardando pagamento</option>
                  <option value="Pagamento rejeitado">Pagamento rejeitado</option>
                  <option value="Pagamento com sucesso">Pagamento com sucesso</option>
                  <option value="Aguardando retirada">Aguardando retirada</option>
                  <option value="Em transito">Em transito</option>
                  <option value="Entregue">Entregue</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="button-wrapper">
                <button class="cancelar">CANCELAR</button>
                <button id="alterar-status" class="alterar">ALTERAR STATUS</button>
              </div>
            </div>
        </div>
      </form>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>
  <div class="card-confirmar"></div>
  <script src="JS/PedidosEstoquista/PedidosEstoquista.js"></script>
  <script src="JS/HeaderFuncionario/HeaderFuncionario.js" defer></script>
  <script src="JS/Geral/Geral.js" defer></script>
</body>

</html>
