<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelaPedido</title>
  <link rel="stylesheet" href="CSS/Reset/Reset.css">
  <link rel="stylesheet" href="CSS/HeaderCliente/headerCliente.css">
  <link rel="stylesheet" href="CSS/Pedidos/Pedidos.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body>
  <header>
    <div class="lado-a">
      <a href="/TelaProduto.html"><img src="src/img/logo-removebg-preview.png" alt="logo-img"></a>
      <input type="search" id="buscar" placeholder="Buscar">
    </div>
    <div class="lado-b">
      <div class="user-carrinho">
        <div class="header-user">
          <img id="iconUsuario" src="src/img/icon-cliente.png" alt="user-icon">
          <p class="nome-usuario"></p>
          <div class="dropdown-content" id="dropdown-content">
            <a class="dados" href="TelaAlterarCliente.html">Perfil</a>
            <a class="Pedidos" href="TelaPedidos.html">Meus pedidos</a>
            <a class="logout" onclick="abrirModalConfirmacao()" href="">Sair</a>
          </div>
        </div>

        <div class="header-carrinho">
          <a href="TelaCarrinho.html">
            <img id="iconCarrinho" src="src/img/vista-lateral-vazia-do-carrinho-de-compras.png" alt="user-icon">
          </a>
          <p class="qtd-carrinho"></p>
        </div>
    </header>
    <main>    
      <div class="sem-pedidos" id="empty-order">
        <h2>VOCÊ NÃO TEM PEDIDOS</h2>
        <img src="src/img/image.png" alt="Icone sem pedidos">
  
        <div id="btn-voltar-inicio">
          <a href="TelaProduto.html">
            <button class="animated-button">
              <span>Voltar para o inicio</span>
              <span></span>
            </button>
          </a>
        </div>
      </div>
        <div id="conteudo-pedidos" class="conteudo-pedidos">
          <h1 class="Titulo">Meus pedidos</h1>
          <div class="table-responsive">
    
            <section>
                <div class="container mt-4">
                  <table class="table table-striped table-bordered">
                    <thead class="thead-dark">
                      <tr>
                        <!-- <th scope="col">Produto</th> -->
                        <th scope="col">N° pedido</th>
                        <th scope="col">Data</th>
                        <th scope="col">Status</th>
                        <th scope="col">Total</th>
                      </tr>
                    </thead>
                    <tbody id="table-group-divider">
                      <!-- Linhas de pedidos serão inseridas aqui -->
                    </tbody>
                  </table>
                </div>
                <div id="detalhesModal">
                    <div id="modalContent">
                        <!-- Conteúdo dos detalhes será inserido aqui -->
                    </div>
                </div>
              </section>
          </div>
          <div id="detalhesModal">
            <div id="modalContent">
              <!-- Conteúdo dos detalhes será inserido aqui -->
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <div id="overlay" class="overlay"></div>
  <div class="card-confirmar"></div>
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script src="JS/Pedidos/Pedidos.js"></script>
        <script src="JS/Geral/Geral.js" defer></script>
      <script src="JS/HeaderCliente/HeaderCliente.js" ></script>
    </body>
</html>
