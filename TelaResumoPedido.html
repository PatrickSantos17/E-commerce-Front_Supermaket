<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resumo do pedido</title>
    <link rel="stylesheet" href="CSS/Reset/Reset.css">

    <link rel="stylesheet" href="CSS/BootStrap/bootstrap.css">
    <link rel="stylesheet" href="CSS/BootStrap/open-iconic-bootstrap.css">

    <link rel="stylesheet" href="CSS/HeaderCliente/headerCliente.css">
    <link rel="stylesheet" href="CSS/ResumoPedido/styles.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />


</head>

<body>
    <header>
        <div class="lado-a">
            <a href="/TelaProduto.html"><img src="src/img/logo-removebg-preview.png" alt="logo-img"></a>
            <input type="search" id="buscar" placeholder="Buscar">
        </div>
        <div class="lado-b">
            <div class="user-carrinho">
                <div class="header-user">
                    <img id="iconUsuario" src="src/img/icon-cliente.png" alt="user-icon">
                    <p class="nome-usuario"></p>
                    <div class="dropdown-content" id="dropdown-content">
                        <a class="dados" href="TelaAlterarCliente.html">Perfil</a>
                        <a class="Pedidos" href="TelaPedidos.html">Meus pedidos</a>
                        <a class="logout" onclick="abrirModalConfirmacao()" href="">Sair</a>
                    </div>
                </div>

                <div class="header-carrinho">
                    <a href="TelaCarrinho.html">
                        <img id="iconCarrinho" src="src/img/vista-lateral-vazia-do-carrinho-de-compras.png"
                            alt="user-icon">
                    </a>
                    <p class="qtd-carrinho"></p>
                </div>
            </div>
            <div class="info-usuario entre-cadastre">
            </div>
        </div>
    </header>
    <main>
        <div class="content">
            <div class="produtosCarrinho">
                <section>
                    <table class="produtoCarrinho">

                    </table>
                </section>
            </div>
        </div>
    </main>
    <div id="loadingModal" class="loading-modal">
        <svg viewBox="25 25 50 50">
            <circle r="20" cy="50" cx="50"></circle>
        </svg>
    </div>

    <div id="overlay" class="overlay"></div>
    <div class="card-confirmar"></div>
    <!-- modal confirmando pagamento -->
    <div class="container-modal" id="container-modal">
        <div class="left-side">
            <div class="card">
                <div class="card-line"></div>
                <div class="buttons"></div>
            </div>
            <div class="post">
                <div class="post-line"></div>
                <div class="screen">
                    <div class="dollar">$</div>
                </div>
                <div class="numbers"></div>
                <div class="numbers-line2"></div>
            </div>
        </div>
        <div class="right-side">
            <div class="new">Processando<span class="piscar">...</span></div>
            <svg viewBox="0 0 451.846 451.847" height="512" width="512" xmlns="http://www.w3.org/2000/svg"
                class="arrow">
                <path fill="#cfcfcf" data-old_color="#000000" class="active-path" data-original="#000000"
                    d="M345.441 248.292L151.154 442.573c-12.359 12.365-32.397 12.365-44.75 0-12.354-12.354-12.354-32.391 0-44.744L278.318 225.92 106.409 54.017c-12.354-12.359-12.354-32.394 0-44.748 12.354-12.359 32.391-12.359 44.75 0l194.287 194.284c6.177 6.18 9.262 14.271 9.262 22.366 0 8.099-3.091 16.196-9.267 22.373z">
                </path>
            </svg>
        </div>
    </div>
    <div class="card-concluido">
        <div class="modal-confirm">
            
        </div>
    </div>

    <script src="JS/HeaderCliente/HeaderCliente.js" defer></script>
    <script src="JS/Geral/Geral.js" defer></script>
    <script src="JS/ResumoPedido/ResumoPedido.JS" defer></script>
    <script src="JS/ResumoPedido/utils.js"></script>
</body>

</html>
